<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 3200" aria-labelledby="title desc" role="img">
  <title id="title">mosdns 请求流程（竖屏紧凑版）</title>
  <desc id="desc">竖屏 1600×3200 图，突出主链路，减少大面积空白，字体≥34px 便于平板阅读。</desc>
  <defs>
    <style>
      :root { font-family: 'LXGW WenKai', 'Inter', 'Noto Sans SC', sans-serif; }
      .background { fill: url(#bg); }
      .section rect { fill: #F6F3FF; stroke: #C7B9FF; stroke-width: 4; rx: 36; }
      .section text { font-size: 54px; font-weight: 600; fill: #4C1D95; }
      .card rect { fill: #FFFFFF; stroke: #4C1D95; stroke-width: 3; rx: 28; }
      .card text { font-size: 36px; fill: #0F172A; font-weight: 500; }
      .card tspan { font-size: 32px; fill: #334155; font-weight: 400; }
      .terminal rect { fill: #4C1D95; stroke: #31186E; }
      .terminal text, .terminal tspan { fill: #FFFFFF; }
      .effect rect { fill: #FFF7E0; stroke: #D97706; }
      .effect text { fill: #7C2D12; }
      .arrow { stroke: #4C1D95; stroke-width: 7; fill: none; marker-end: url(#arrowhead); }
      .arrow-dashed { stroke-dasharray: 14 16; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EEF2FF" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <marker id="arrowhead" markerWidth="22" markerHeight="22" refX="16" refY="11" orient="auto">
      <path d="M0,0 L22,11 L0,22 Z" fill="#4C1D95" />
    </marker>
  </defs>
  <rect class="background" x="0" y="0" width="1600" height="3200"/>

  <!-- 入口过滤区 -->
  <g class="section" transform="translate(120,120)">
    <rect width="1360" height="820"/>
    <text x="40" y="80">入口过滤 (sequence_6666)</text>
    <g class="card terminal" transform="translate(120,160)">
      <rect width="1120" height="120"/>
      <text x="560" y="70" text-anchor="middle">客户端请求 · UDP/TCP :53</text>
    </g>
    <g class="card decision" transform="translate(120,320)">
      <rect width="1120" height="160"/>
      <text x="560" y="70" text-anchor="middle">QTYPE 过滤<tspan x="560" dy="42">switch6/5 拦截 AAAA / SOA / PTR / HTTPS</tspan></text>
    </g>
    <g class="card" transform="translate(120,520)">
      <rect width="1120" height="160"/>
      <text x="560" y="60" text-anchor="middle">DDNS & 国内查询<tspan x="560" dy="40">命中 → 国内返回；未命中 → 名单/插件检查</tspan></text>
    </g>
    <g class="card" transform="translate(120,720)">
      <rect width="1120" height="180"/>
      <text x="560" y="60" text-anchor="middle">名单 / 插件组合<tspan x="560" dy="38">黑名单、无V4/V6、AdGuard、switch2 客户端</tspan><tspan x="560" dy="36">通过者 → 重写与类型判断</tspan></text>
    </g>
  </g>

  <g class="card" transform="translate(240,1020)">
    <rect width="1120" height="200"/>
    <text x="560" y="60" text-anchor="middle">重写 & 类型判断<tspan x="560" dy="38">命中 rewrite → 上游查询；仅 A/AAAA 进入名单分流</tspan><tspan x="560" dy="36">其余 geosite_cn 国内/国外直接返回</tspan></text>
  </g>

  <!-- 名单阶段 -->
  <g class="section" transform="translate(120,1280)">
    <rect width="1360" height="1150"/>
    <text x="40" y="80">名单与国内结果</text>
    <g class="card" transform="translate(120,140)">
      <rect width="1120" height="170"/>
      <text x="560" y="60" text-anchor="middle">灰名单<tspan x="560" dy="40">命中 → fakeip (sing-box)</tspan><tspan x="560" dy="36">未命中 → 白名单</tspan></text>
    </g>
    <g class="card" transform="translate(120,350)">
      <rect width="1120" height="210"/>
      <text x="560" y="60" text-anchor="middle">白名单流程<tspan x="560" dy="40">国内查询 + nov4/nov6 写入</tspan><tspan x="560" dy="36">CNtoMihomo? → fakeip (mihomo)，否则 real IP</tspan></text>
    </g>
    <g class="card" transform="translate(120,600)">
      <rect width="1120" height="220"/>
      <text x="560" y="60" text-anchor="middle">自/在线清单<tspan x="560" dy="40">国外命中 → fakeip (sing-box)</tspan><tspan x="560" dy="36">国内命中 → local_cn_scan</tspan><tspan x="560" dy="36">均未命中 → 模式决策</tspan></text>
    </g>
    <g class="card effect" transform="translate(120,850)">
      <rect width="1120" height="220"/>
      <text x="560" y="60" text-anchor="middle">国内结果判断 + 列表更新<tspan x="560" dy="40">命中 17.0.0.0/8 → 加入自生成国内</tspan><tspan x="560" dy="36">rcode0 无 IP → 写入 nov4/nov6</tspan><tspan x="560" dy="36">按需要进入 mode_entry</tspan></text>
    </g>
  </g>

  <!-- 模式决策 -->
  <g class="section" transform="translate(120,2480)">
    <rect width="1360" height="520"/>
    <text x="40" y="80">模式决策 / 终态</text>
    <g class="card" transform="translate(120,140)">
      <rect width="1120" height="180"/>
      <text x="560" y="60" text-anchor="middle">mode_entry<tspan x="560" dy="36">兼容（国内优先） / 安全（国外优先）</tspan><tspan x="560" dy="36">依 rcode 写入 nov4/nov6，判断 IP 归属 → fakeip / real</tspan></text>
    </g>
    <g class="card terminal" transform="translate(120,350)">
      <rect width="1120" height="150"/>
      <text x="560" y="60" text-anchor="middle">终态：real IP | fake IP | NXDOMAIN<tspan x="560" dy="40">对应 domestic query / sing-box or Mihomo / 拦截节点</tspan></text>
    </g>
  </g>

  <!-- 副作用备注 -->
  <g class="card effect" transform="translate(240,3060)">
    <rect width="1120" height="160"/>
    <text x="560" y="70" text-anchor="middle">副作用记录：自生成国内/国外、nov4/nov6、fakeip 列表</text>
  </g>

  <!-- 箭头 -->
  <path class="arrow" d="M800 400 L800 480"/>
  <path class="arrow" d="M800 660 L800 720"/>
  <path class="arrow" d="M800 900 L800 1020"/>
  <path class="arrow" d="M800 1180 L800 1280"/>
  <path class="arrow" d="M800 2420 L800 2480"/>
  <path class="arrow arrow-dashed" d="M800 2140 C1100 2140 1180 1900 1180 1900"/>
  <path class="arrow arrow-dashed" d="M420 1860 C420 2000 420 2300 420 2300"/>
</svg>
