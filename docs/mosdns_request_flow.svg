<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" aria-labelledby="title desc" role="img">
  <title id="title">mosdns 请求流程（横屏紧凑版）</title>
  <desc id="desc">以泳道方式呈现入口过滤、名单分流、模式决策、副作用和终态输出，字体加粗、布局紧凑便于 4K/2K 屏阅读。</desc>
  <defs>
    <style>
      :root { font-family: 'LXGW WenKai', 'Inter', 'Noto Sans SC', sans-serif; }
      .background { fill: url(#bg); }
      .lane-bg { fill: #F8F5FF; stroke: #C7B9FF; stroke-width: 3; rx: 32; }
      .lane-title { font-size: 48px; font-weight: 600; fill: #4C1D95; }
      .card rect { fill: #FFFFFF; stroke: #4C1D95; stroke-width: 3; rx: 26; }
      .card text { font-size: 34px; fill: #0F172A; font-weight: 500; }
      .card tspan { font-size: 30px; fill: #334155; font-weight: 400; }
      .card .muted { fill: #64748B; font-size: 28px; }
      .terminal rect { fill: #4C1D95; stroke: #31186E; }
      .terminal text, .terminal tspan { fill: #FFFFFF; }
      .effect rect { fill: #FFF7E0; stroke: #D97706; }
      .effect text { fill: #7C2D12; }
      .arrow { stroke: #4C1D95; stroke-width: 8; fill: none; marker-end: url(#arrowhead); }
      .arrow-dashed { stroke-dasharray: 16 18; }
      .arrow text { font-size: 28px; fill: #4C1D95; font-weight: 600; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EEF2FF" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <marker id="arrowhead" markerWidth="24" markerHeight="24" refX="18" refY="12" orient="auto">
      <path d="M0,0 L24,12 L0,24 Z" fill="#4C1D95" />
    </marker>
  </defs>
  <rect class="background" x="0" y="0" width="3840" height="2160"/>

  <!-- 泳道背景 -->
  <g transform="translate(80,120)">
    <rect class="lane-bg" width="640" height="1920"/>
    <text class="lane-title" x="40" y="70">入口过滤</text>
  </g>
  <g transform="translate(800,120)">
    <rect class="lane-bg" width="640" height="1920"/>
    <text class="lane-title" x="40" y="70">主分流 / 名单</text>
  </g>
  <g transform="translate(1520,120)">
    <rect class="lane-bg" width="640" height="1920"/>
    <text class="lane-title" x="40" y="70">模式决策</text>
  </g>
  <g transform="translate(2240,120)">
    <rect class="lane-bg" width="640" height="1920"/>
    <text class="lane-title" x="40" y="70">副作用</text>
  </g>
  <g transform="translate(2960,120)">
    <rect class="lane-bg" width="640" height="1920"/>
    <text class="lane-title" x="40" y="70">终态</text>
  </g>

  <!-- 入口过滤卡片 -->
  <g class="card terminal" transform="translate(140,220)">
    <rect width="520" height="130"/>
    <text x="260" y="70" text-anchor="middle">客户端请求<tspan x="260" dy="48">UDP/TCP :53</tspan></text>
  </g>
  <g class="card decision" transform="translate(140,410)">
    <rect width="520" height="150"/>
    <text x="260" y="70" text-anchor="middle">QTYPE 过滤<tspan x="260" dy="44">switch6/5 限制 AAAA / SOA / PTR / HTTPS</tspan></text>
  </g>
  <g class="card" transform="translate(140,610)">
    <rect width="520" height="170"/>
    <text x="260" y="60" text-anchor="middle">DDNS &amp; 国内查询<tspan x="260" dy="40">命中 ddnslist → 国内返回</tspan><tspan x="260" dy="36">未命中 → 进入名单/插件检查</tspan></text>
  </g>
  <g class="card" transform="translate(140,840)">
    <rect width="520" height="220"/>
    <text x="260" y="60" text-anchor="middle">名单 / 插件检查<tspan x="260" dy="40">switch1 黑名单、无V4/V6 组合</tspan><tspan x="260" dy="36">AdGuard 插件 &amp; 在线广告域</tspan><tspan x="260" dy="36">客户端白名单 (switch2)</tspan></text>
  </g>
  <g class="card" transform="translate(140,1110)">
    <rect width="520" height="220"/>
    <text x="260" y="60" text-anchor="middle">重写 &amp; 类型判定<tspan x="260" dy="40">命中 rewrite → 上游查询</tspan><tspan x="260" dy="36">仅 A/AAAA 进入名单分流</tspan><tspan x="260" dy="36">其余按 geosite_cn 国内/国外处理</tspan></text>
  </g>

  <!-- 主分流卡片 -->
  <g class="card" transform="translate(860,340)">
    <rect width="520" height="180"/>
    <text x="260" y="70" text-anchor="middle">灰名单<tspan x="260" dy="42">命中 → fakeip (sing-box)</tspan><tspan x="260" dy="36">未命中 → 白名单判断</tspan></text>
  </g>
  <g class="card" transform="translate(860,570)">
    <rect width="520" height="220"/>
    <text x="260" y="60" text-anchor="middle">白名单流程<tspan x="260" dy="40">国内查询 + nov4/nov6 标记</tspan><tspan x="260" dy="36">CNtoMihomo? → fakeip (mihomo)</tspan><tspan x="260" dy="36">否则 real IP</tspan></text>
  </g>
  <g class="card" transform="translate(860,840)">
    <rect width="520" height="230"/>
    <text x="260" y="60" text-anchor="middle">自/在线清单<tspan x="260" dy="40">国外 → fakeip (sing-box)</tspan><tspan x="260" dy="36">国内 → local_cn_scan</tspan><tspan x="260" dy="36">均未命中 → 模式决策</tspan></text>
  </g>
  <g class="card" transform="translate(860,1120)">
    <rect width="520" height="250"/>
    <text x="260" y="60" text-anchor="middle">国内结果判断<tspan x="260" dy="40">命中 17.0.0.0/8 → 加入自生成国内</tspan><tspan x="260" dy="36">rcode0 无 IP → 写入 nov4/nov6</tspan><tspan x="260" dy="36">可直返 real IP 或继续模式决策</tspan></text>
  </g>
  <g class="card note" transform="translate(860,1430)">
    <rect width="520" height="150"/>
    <text x="260" y="70" text-anchor="middle">进入模式决策<tspan x="260" dy="40">mode_entry（兼容 / 安全）</tspan></text>
  </g>

  <!-- 模式决策卡片 -->
  <g class="card decision" transform="translate(1580,420)">
    <rect width="520" height="160"/>
    <text x="260" y="70" text-anchor="middle">模式选择<tspan x="260" dy="40">根据策略切换兼容/安全</tspan></text>
  </g>
  <g class="card" transform="translate(1580,640)">
    <rect width="520" height="260"/>
    <text x="260" y="60" text-anchor="middle">兼容模式（国内优先）<tspan x="260" dy="40">rcode0 无AAAA → 记录 nov6 返回国内</tspan><tspan x="260" dy="36">rcode0 无A → 记录 nov4</tspan><tspan x="260" dy="36">结果为国外 → fakeip，国内 → CNtoMihomo/real</tspan></text>
  </g>
  <g class="card" transform="translate(1580,970)">
    <rect width="520" height="260"/>
    <text x="260" y="60" text-anchor="middle">安全模式（国外优先）<tspan x="260" dy="40">逻辑同上，但以国外结果优先</tspan><tspan x="260" dy="36">国内补查失败 → 记录 nov4</tspan><tspan x="260" dy="36">中国 IP → real / Mihomo</tspan></text>
  </g>

  <!-- 副作用 -->
  <g class="card effect" transform="translate(2300,540)">
    <rect width="520" height="320"/>
    <text x="260" y="60" text-anchor="middle">副作用 / 列表更新<tspan x="260" dy="40">自生成国内 / 国外列表</tspan><tspan x="260" dy="36">nov4 / nov6 记录</tspan><tspan x="260" dy="36">灰名单写回 sing-box / mihomo</tspan><tspan class="muted" x="260" dy="40">所有写操作对应 why.md 核心场景</tspan></text>
  </g>

  <!-- 终态 -->
  <g class="card terminal" transform="translate(3020,420)">
    <rect width="520" height="150"/>
    <text x="260" y="70" text-anchor="middle">终止 / NXDOMAIN<tspan x="260" dy="44">黑名单 / 无Vx / 广告</tspan></text>
  </g>
  <g class="card terminal" transform="translate(3020,640)">
    <rect width="520" height="190"/>
    <text x="260" y="70" text-anchor="middle">返回 real IP<tspan x="260" dy="40">国内查询、白名单、模式下国内结果</tspan><tspan x="260" dy="36">local_ddns / local_client / rewrite</tspan></text>
  </g>
  <g class="card terminal" transform="translate(3020,900)">
    <rect width="520" height="190"/>
    <text x="260" y="70" text-anchor="middle">返回 fake IP<tspan x="260" dy="40">灰名单、国外清单、兼容/安全模式结果</tspan><tspan x="260" dy="36">sing-box / mihomo 泳道</tspan></text>
  </g>

  <!-- 箭头 -->
  <path class="arrow" d="M400 350 L400 400"/>
  <path class="arrow" d="M400 560 L400 610"/>
  <path class="arrow" d="M400 770 L400 840"/>
  <path class="arrow" d="M400 1060 L400 1110"/>
  <path class="arrow" d="M660 1220 C780 1220 860 1220 860 1290"/>
  <path class="arrow" d="M1120 520 L1120 570"/>
  <path class="arrow" d="M1120 780 L1120 840"/>
  <path class="arrow" d="M1120 1070 L1120 1120"/>
  <path class="arrow" d="M1120 1370 L1120 1430"/>
  <path class="arrow" d="M1380 1500 C1520 1500 1680 520 1680 520" />
  <path class="arrow" d="M1680 580 L1680 640"/>
  <path class="arrow" d="M1680 900 L1680 970"/>
  <path class="arrow" d="M2120 700 C2440 700 3020 520 3020 520"/>
  <path class="arrow" d="M2120 860 C2440 860 3020 760 3020 760"/>
  <path class="arrow" d="M2120 1110 C2440 1110 3020 1020 3020 1020"/>
  <path class="arrow arrow-dashed" d="M1380 960 C1880 960 2300 620 2300 620"/>
  <path class="arrow arrow-dashed" d="M1380 1180 C1880 1180 2300 760 2300 760"/>
</svg>
